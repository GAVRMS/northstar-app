<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Northstar</title>
<meta name="theme-color" content="#1C3A4A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4F6F7;
    --surface:#FFFFFF;
    --surface-2:#EAEEEF;
    --ink:#16232A;
    --ink-dim:#5B6B72;
    --line:#DCE3E5;
    --primary:#1C3A4A;
    --primary-ink:#FFFFFF;
    --accent:#E0983B;
    --accent-ink:#2A1B04;
    --success:#4C8F68;
    --success-bg:#E4F0E7;
    --danger:#BE5445;
    --danger-bg:#FBEAE7;
    --info-bg:#E7EEF1;
    --focus-bg:#EFE6F5;
    --focus:#7A4FA0;
    --pri-critical:#BE5445;
    --pri-high:#E0983B;
    --pri-medium:#2F7A72;
    --pri-low:#8592A6;
    --shadow: 0 1px 2px rgba(22,35,42,.06), 0 6px 20px -8px rgba(22,35,42,.18);
    --radius-l: 20px;
    --radius-m: 14px;
    --radius-s: 9px;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#12191C; --surface:#1A2328; --surface-2:#212C31; --ink:#EDF2F3; --ink-dim:#94A6AC;
      --line:#2B3940; --primary:#4C90A8; --primary-ink:#0B1417; --accent:#E8A857; --accent-ink:#1D1204;
      --success:#79C79A; --success-bg:#1D2E22; --danger:#E28D7E; --danger-bg:#33201C; --info-bg:#1D2A2F;
      --focus-bg:#2A2032; --focus:#C9A6E8;
      --pri-critical:#E28D7E; --pri-high:#E8A857; --pri-medium:#5CC7BB; --pri-low:#9AA6B8;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#12191C; --surface:#1A2328; --surface-2:#212C31; --ink:#EDF2F3; --ink-dim:#94A6AC;
    --line:#2B3940; --primary:#4C90A8; --primary-ink:#0B1417; --accent:#E8A857; --accent-ink:#1D1204;
    --success:#79C79A; --success-bg:#1D2E22; --danger:#E28D7E; --danger-bg:#33201C; --info-bg:#1D2A2F;
    --focus-bg:#2A2032; --focus:#C9A6E8;
    --pri-critical:#E28D7E; --pri-high:#E8A857; --pri-medium:#5CC7BB; --pri-low:#9AA6B8;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 24px -10px rgba(0,0,0,.5);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Work Sans', system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .app{
    max-width:560px;
    margin:0 auto;
    min-height:100%;
    display:flex;
    flex-direction:column;
    padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px));
  }
  h1,h2,h3{font-family:'Fraunces', serif; margin:0; text-wrap:balance;}
  .mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}
  button{font-family:inherit;}
  a{color:inherit;}

  .boot-screen{
    position:fixed; inset:0; background:var(--primary); color:var(--primary-ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100;
    font-family:'Fraunces',serif; font-size:22px; gap:14px;
  }
  .boot-screen .spinner{
    width:34px; height:34px; border-radius:50%; border:3px solid rgba(255,255,255,.3); border-top-color:#fff;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  /* ---------- header ---------- */
  .topbar{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:20;
    background:var(--primary); color:var(--primary-ink);
    padding: 18px 18px 20px;
    border-radius: 0 0 24px 24px;
    box-shadow: var(--shadow);
  }
  .topbar-row{display:flex; align-items:flex-start; justify-content:space-between; gap:12px;}
  .greeting{font-size:22px; font-weight:600; line-height:1.15;}
  .greeting .date{display:block; font-family:'Work Sans'; font-size:13px; opacity:.78; font-weight:500; margin-top:3px;}
  .streak-pill{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,.14); border:1px solid rgba(255,255,255,.22);
    padding:7px 12px; border-radius:999px; font-size:13px; font-weight:600; white-space:nowrap;
  }
  .streak-pill .flame{font-size:15px;}
  .encourage{
    margin-top:14px; font-size:14.5px; line-height:1.45; opacity:.94; max-width:46ch;
  }

  .stat-strip{
    display:grid; grid-auto-flow:column; grid-auto-columns: minmax(84px,1fr);
    gap:8px; overflow-x:auto; padding: 14px 18px 4px; scrollbar-width:none;
  }
  .stat-strip::-webkit-scrollbar{display:none;}
  .stat-tile{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m);
    padding:10px 12px; text-align:left; cursor:pointer;
  }
  .stat-tile .n{font-family:'Fraunces',serif; font-size:24px; font-weight:600; line-height:1;}
  .stat-tile .l{font-size:11px; color:var(--ink-dim); margin-top:4px; font-weight:600; text-transform:uppercase; letter-spacing:.03em;}
  .stat-tile.warn .n{color:var(--danger);}

  /* ---------- sections ---------- */
  main{flex:1; padding: 6px 18px 20px;}
  main.no-header{padding-top: calc(16px + env(safe-area-inset-top,0px));}
  .section{margin-top:22px;}
  .section-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px;}
  .section-head h2{font-size:18px; font-weight:600;}
  .link-btn{background:none; border:none; color:var(--primary); font-weight:600; font-size:13px; cursor:pointer; padding:4px;}

  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-l);
    box-shadow: var(--shadow);
  }
  .empty{
    padding:22px 16px; text-align:center; color:var(--ink-dim); font-size:14px;
    background:var(--surface); border:1px dashed var(--line); border-radius:var(--radius-l);
  }

  .item-row{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 14px; border-bottom:1px solid var(--line);
  }
  .item-row:last-child{border-bottom:none;}
  .check{
    flex:0 0 auto; width:26px; height:26px; border-radius:50%;
    border:2px solid var(--line); background:var(--surface);
    display:flex; align-items:center; justify-content:center; cursor:pointer; margin-top:1px;
    color:transparent; font-size:14px;
  }
  .check.done{background:var(--success); border-color:var(--success); color:#fff;}
  .item-body{flex:1; min-width:0;}
  .item-title{font-weight:600; font-size:15px; line-height:1.3;}
  .item-title.done{text-decoration:line-through; color:var(--ink-dim); text-decoration-color:var(--ink-dim);}
  .item-meta{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
  .chip{
    font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px;
    background:var(--info-bg); color:var(--ink-dim); text-transform:uppercase; letter-spacing:.02em;
  }
  .chip.pri-critical{background:var(--danger-bg); color:var(--danger);}
  .chip.pri-high{background:var(--accent); color:var(--accent-ink);}
  .chip.time{font-family:'IBM Plex Mono'; text-transform:none; letter-spacing:0;}
  .chip.reason{background:var(--focus-bg); color:var(--focus);}
  .item-actions{display:flex; gap:4px; flex:0 0 auto;}
  .icon-btn{
    width:32px; height:32px; border-radius:50%; border:none; background:transparent;
    color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; font-size:16px;
  }
  .icon-btn:active{background:var(--surface-2);}
  .tip-refresh{width:28px; height:28px; color:var(--focus); flex:0 0 auto;}
  .tip-refresh:hover{background:rgba(255,255,255,.5);}
  .tip-refresh svg{transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
  .tip-refresh:active svg{transform:rotate(180deg);}

  /* recommendation / focus card */
  .focus-card{background:linear-gradient(135deg, var(--primary), #2E5468); color:var(--primary-ink); padding:16px; border-radius:var(--radius-l); box-shadow:var(--shadow);}
  .focus-card h2{color:var(--primary-ink); font-size:17px;}
  .focus-item{display:flex; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid rgba(255,255,255,.16);}
  .focus-item:last-child{border-bottom:none;}
  .focus-num{flex:0 0 auto; width:22px; height:22px; border-radius:50%; background:rgba(255,255,255,.2); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; margin-top:1px;}
  .focus-body{flex:1;}
  .focus-title{font-weight:600; font-size:14.5px;}
  .focus-reason{font-size:12px; opacity:.82; margin-top:2px;}
  .warn-banner{
    display:flex; gap:10px; align-items:flex-start; background:var(--danger-bg); color:var(--danger);
    border-radius:var(--radius-m); padding:12px 14px; font-size:13px; line-height:1.4; margin-top:12px;
  }

  /* goals */
  .goal-card{padding:16px; margin-bottom:12px;}
  .goal-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .goal-title{font-size:16.5px; font-weight:600; font-family:'Fraunces',serif;}
  .goal-progress-wrap{margin-top:10px; display:flex; align-items:center; gap:10px;}
  .goal-bar{flex:1; height:8px; border-radius:999px; background:var(--surface-2); overflow:hidden;}
  .goal-bar-fill{height:100%; background:linear-gradient(90deg, var(--primary), var(--accent)); border-radius:999px; transition:width .3s ease;}
  .goal-pct{font-size:12px; font-weight:700; color:var(--ink-dim); font-family:'IBM Plex Mono';}
  .sub-list{margin-top:12px; display:flex; flex-direction:column; gap:2px;}
  .sub-row{display:flex; align-items:center; gap:10px; padding:6px 0;}
  .sub-row .check{width:22px; height:22px; font-size:12px;}
  .sub-text{font-size:14px; flex:1;}
  .sub-text.done{text-decoration:line-through; color:var(--ink-dim);}
  .add-sub{display:flex; gap:8px; margin-top:10px; align-items:center;}
  .add-sub input{flex:1; border:1px solid var(--line); background:var(--bg); border-radius:var(--radius-s); padding:8px 10px; font-size:13.5px; color:var(--ink); font-family:inherit;}
  .mini-btn{background:var(--primary); color:var(--primary-ink); border:none; border-radius:var(--radius-s); padding:8px 12px; font-size:13px; font-weight:600; cursor:pointer;}
  .suggested-tag{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:700; color:var(--focus); background:var(--focus-bg); padding:4px 10px; border-radius:999px; margin-top:8px;}

  /* dashboard: stat strip, filters, priority stripes, status pills, log buttons, heatmap */
  .dash-stats{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;}
  .dash-stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-m); padding:10px 11px; box-shadow:var(--shadow);}
  .dash-stat .dl{font-size:10px; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-dim); font-weight:700; white-space:nowrap;}
  .dash-stat .dv{font-family:'Fraunces',serif; font-size:21px; font-weight:600; margin-top:3px;}
  .dash-stat .dv small{font-family:'Work Sans'; font-size:11px; color:var(--ink-dim); font-weight:600; margin-left:3px;}
  .dash-stat.streak .dv{color:var(--accent);}

  .filter-pills{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px;}
  .fpill{font-family:inherit; font-size:12.5px; font-weight:600; color:var(--ink-dim); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:6px 12px; cursor:pointer;}
  .fpill.active{background:var(--primary); color:var(--primary-ink); border-color:var(--primary);}

  .goal-card{border-left:4px solid var(--line);}
  .goal-card.pri-Critical{border-left-color:var(--pri-critical);}
  .goal-card.pri-High{border-left-color:var(--pri-high);}
  .goal-card.pri-Medium{border-left-color:var(--pri-medium);}
  .goal-card.pri-Low{border-left-color:var(--pri-low);}

  .status-pill{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.02em; padding:3px 9px; border-radius:999px; white-space:nowrap;}
  .status-pill.complete{background:var(--success-bg); color:var(--success);}
  .status-pill.progress{background:var(--info-bg); color:var(--primary);}
  .status-pill.not{background:var(--surface-2); color:var(--ink-dim);}

  .goal-points{font-size:12px; color:var(--accent); font-weight:700; margin-top:6px;}

  .sub-row .logbtn{
    flex:0 0 auto; width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--bg);
    color:var(--ink-dim); display:flex; align-items:center; justify-content:center; cursor:pointer; position:relative; font-size:13px;
  }
  .sub-row .logbtn:active{background:var(--surface-2);}
  .sub-row .logcount{
    position:absolute; top:-6px; right:-6px; background:var(--accent); color:var(--accent-ink);
    font-size:9px; font-weight:700; min-width:14px; height:14px; border-radius:8px;
    display:flex; align-items:center; justify-content:center; padding:0 3px;
  }
  .sub-row .icon-btn{width:26px; height:26px; font-size:13px; flex:0 0 auto;}
  .sub-row .icon-btn.sub-del{color:var(--danger);}

  .heatmap-wrap{overflow-x:auto; padding-bottom:2px;}
  .heatmap{display:flex; gap:3px;}
  .heat-col{display:flex; flex-direction:column; gap:3px;}
  .heat-cell{width:11px; height:11px; border-radius:3px; background:var(--surface-2);}
  .heat-cell[data-level="1"]{background:rgba(224,152,59,.35);}
  .heat-cell[data-level="2"]{background:rgba(224,152,59,.55);}
  .heat-cell[data-level="3"]{background:rgba(224,152,59,.8);}
  .heat-cell[data-level="4"]{background:var(--accent);}

  .floatpoint{
    position:fixed; pointer-events:none; z-index:200; font-family:'IBM Plex Mono'; font-weight:700; font-size:14px;
    color:var(--accent); animation: floatup .9s ease forwards;
  }
  @keyframes floatup{
    0%{opacity:0; transform:translateY(0) scale(.8);}
    15%{opacity:1; transform:translateY(-6px) scale(1);}
    100%{opacity:0; transform:translateY(-38px) scale(1);}
  }

  .cal-btn{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    color:var(--primary); background:var(--info-bg); border-radius:999px; padding:5px 10px;
    text-decoration:none; margin-top:8px;
  }

  /* ---------- nav ---------- */
  .tabbar{ position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex; justify-content:center; }
  .tabbar-inner{
    max-width:560px; width:100%; margin:0 16px;
    background:var(--surface); border:1px solid var(--line);
    border-radius:22px; box-shadow: var(--shadow);
    display:flex; align-items:center; justify-content:space-around;
    padding: 8px 6px calc(8px + env(safe-area-inset-bottom,0px));
    margin-bottom: 12px;
  }
  .tab-btn{
    background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:3px;
    color:var(--ink-dim); font-size:11px; font-weight:600; padding:6px 10px; cursor:pointer; border-radius:12px;
  }
  .tab-btn.active{color:var(--primary);}
  .tab-btn .ic{font-size:19px;}
  .mic-fab{
    width:58px; height:58px; border-radius:50%; border:none; margin-top:-30px;
    background: var(--accent); color:var(--accent-ink);
    box-shadow: 0 6px 18px -4px rgba(224,152,59,.55), var(--shadow);
    display:flex; align-items:center; justify-content:center; font-size:24px; cursor:pointer;
  }
  .mic-fab.listening{ animation: pulse 1.1s ease-in-out infinite; background:var(--danger); color:#fff;}
  @keyframes pulse{ 0%{box-shadow:0 0 0 0 rgba(190,84,69,.45);} 70%{box-shadow:0 0 0 16px rgba(190,84,69,0);} 100%{box-shadow:0 0 0 0 rgba(190,84,69,0);} }

  /* ---------- voice sheet / toast ---------- */
  .voice-sheet{
    position:fixed; left:16px; right:16px; bottom:calc(100px + env(safe-area-inset-bottom,0px));
    max-width:528px; margin:0 auto; z-index:40;
    background:var(--primary); color:var(--primary-ink);
    border-radius:18px; padding:14px 16px; box-shadow:var(--shadow);
    font-size:14px; line-height:1.4;
    transform:translateY(12px); opacity:0; pointer-events:none; transition: all .22s ease;
  }
  .voice-sheet.show{transform:translateY(0); opacity:1;}
  .voice-sheet .label{font-size:11px; text-transform:uppercase; letter-spacing:.05em; opacity:.75; font-weight:700; margin-bottom:4px;}

  /* ---------- modal ---------- */
  .modal-backdrop{ position:fixed; inset:0; background:rgba(10,16,19,.5); z-index:50; display:flex; align-items:flex-end; justify-content:center; }
  .modal-backdrop[hidden]{display:none;}
  .modal{ background:var(--surface); width:100%; max-width:560px; border-radius:22px 22px 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom,0px)); max-height:86vh; overflow-y:auto; }
  .modal h3{font-size:18px; margin-bottom:14px;}
  .field{margin-bottom:12px;}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--ink-dim); margin-bottom:5px; text-transform:uppercase; letter-spacing:.03em;}
  .field input, .field select, .field textarea{
    width:100%; border:1px solid var(--line); background:var(--bg); color:var(--ink);
    border-radius:var(--radius-s); padding:10px 12px; font-size:15px; font-family:inherit;
  }
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex; gap:10px; margin-top:16px;}
  .btn-primary{flex:1; background:var(--primary); color:var(--primary-ink); border:none; border-radius:var(--radius-m); padding:13px; font-weight:700; font-size:15px; cursor:pointer;}
  .btn-ghost{background:none; border:1px solid var(--line); color:var(--ink); border-radius:var(--radius-m); padding:13px 16px; font-weight:600; font-size:15px; cursor:pointer;}

  .fab-add{
    position:fixed; right:calc(16px + max(0px, (100vw - 560px)/2)); bottom: calc(100px + env(safe-area-inset-bottom,0px));
    width:50px; height:50px; border-radius:50%; border:none; background:var(--primary); color:var(--primary-ink);
    font-size:24px; box-shadow:var(--shadow); cursor:pointer; z-index:25;
  }

  .banner-offline{ background:var(--info-bg); color:var(--ink-dim); font-size:12.5px; text-align:center; padding:8px 14px; border-radius:12px; margin:12px 18px 0; }
  [hidden]{display:none!important;}
</style>
</head>
<body>

<div class="boot-screen" id="bootScreen">
  <div class="spinner"></div>
  <div>Northstar</div>
</div>

<div class="app" id="app" hidden>
  <div class="topbar">
    <div class="topbar-row">
      <div class="greeting" id="greeting">
        Hello, Gaurav
        <span class="date" id="todayDate"></span>
      </div>
      <div class="streak-pill"><span class="flame">🔥</span><span id="streakCount">0</span> day streak</div>
    </div>
    <div class="encourage" id="encourageLine">Loading your focus for today…</div>
  </div>

  <div class="stat-strip" id="statStrip"></div>

  <div id="offlineBanner" class="banner-offline" hidden>Working in local preview mode — this device only.</div>

  <main id="mainContent"></main>
</div>

<div class="voice-sheet" id="voiceSheet">
  <div class="label" id="voiceLabel">Listening</div>
  <div id="voiceText">Say something like "add gym tomorrow" or "what's today"</div>
</div>

<button class="fab-add" id="fabAdd" title="Quick add" aria-label="Quick add" hidden>+</button>

<div class="tabbar" id="tabbar" hidden>
  <div class="tabbar-inner">
    <button class="tab-btn active" data-tab="today"><span class="ic">◆</span>Today</button>
    <button class="tab-btn" data-tab="planner"><span class="ic">▤</span>Planner</button>
    <button class="mic-fab" id="micBtn" aria-label="Voice"><span id="micIcon">🎙️</span></button>
    <button class="tab-btn" data-tab="goals"><span class="ic">✺</span>Goals</button>
    <button class="tab-btn" data-tab="health"><span class="ic">🩺</span>Health</button>
  </div>
</div>

<div class="modal-backdrop" id="modalBackdrop" hidden>
  <div class="modal" id="modalBody"></div>
</div>

<!-- Firebase compat SDK: keeps a collection()/doc()/onSnapshot() API close to what this app was originally built against -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js?v=20261001c"></script>
</body>
</html>
